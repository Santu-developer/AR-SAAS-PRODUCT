<title>Aether AR - Verify Number</title>

<!-- Using a standard sans-serif fallback for Geist if not locally available, but applying the class name as requested -->
<style>
        @font-face {
            font-family: 'Geist';
            src: local('system-ui'); /* Placeholder for actual Geist font */
        }
        
        /* Custom animation for success glow */
        @keyframes successGlow {
            0% { box-shadow: 0 0 0 rgba(212, 175, 55, 0); border-color: rgba(255, 255, 255, 0.08); }
            50% { box-shadow: 0 0 20px rgba(212, 175, 55, 0.3); border-color: #D4AF37; }
            100% { box-shadow: 0 0 10px rgba(212, 175, 55, 0.15); border-color: #D4AF37; }
        }
        .otp-success {
            animation: successGlow 0.8s ease-out forwards;
        }
        
        /* Implied keypad hiding native selection */
        .no-select {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
    </style>

                        "tertiary-fixed-dim": "#c6c6c7",

                        "tertiary": "#ffffff",

                        "on-error": "#690005",

<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-canvas-black text-on-surface min-h-screen flex flex-col items-center justify-between relative overflow-hidden font-body-md no-select">
<!-- Atmospheric Background Glow -->
<div class="absolute top-[-10%] left-[-10%] w-[50vw] h-[50vw] rounded-full bg-surface-highest opacity-20 blur-[100px] pointer-events-none"></div>
<div class="absolute bottom-[-20%] right-[-10%] w-[60vw] h-[60vw] rounded-full bg-accent-gold opacity-5 blur-[120px] pointer-events-none"></div>
<!-- Main Content Area -->
<main class="w-full max-w-md px-margin-mobile pt-16 flex flex-col items-center z-10 flex-grow">
<!-- Header -->
<div class="text-center mb-stack-lg w-full">
<div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-glass-fill border border-border-subtle mb-stack-md text-on-surface-variant">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">lock</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary mb-2">Verify Your Number</h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px] mx-auto">
                We've sent a 6-digit code to <br/> <span class="text-on-surface">+1 (555) •••-••89</span>
</p>
</div>
<!-- Glassmorphic OTP Container -->
<div class="w-full bg-surface-elevated/40 backdrop-blur-2xl border border-border-subtle rounded-3xl p-6 flex flex-col items-center shadow-[0_0_40px_rgba(0,0,0,0.5)]">
<!-- OTP Inputs -->
<div class="flex justify-between w-full gap-2 mb-stack-md" id="otp-container">
<!-- Inputs generated via JS for interaction, but styled here for structure -->
<div class="otp-slot w-10 h-14 border-b-2 border-border-subtle flex items-center justify-center font-headline-lg-mobile text-headline-lg-mobile text-primary transition-all duration-300 relative"></div>
<div class="otp-slot w-10 h-14 border-b-2 border-border-subtle flex items-center justify-center font-headline-lg-mobile text-headline-lg-mobile text-primary transition-all duration-300 relative"></div>
<div class="otp-slot w-10 h-14 border-b-2 border-border-subtle flex items-center justify-center font-headline-lg-mobile text-headline-lg-mobile text-primary transition-all duration-300 relative"></div>
<div class="otp-slot w-10 h-14 border-b-2 border-border-subtle flex items-center justify-center font-headline-lg-mobile text-headline-lg-mobile text-primary transition-all duration-300 relative"></div>
<div class="otp-slot w-10 h-14 border-b-2 border-border-subtle flex items-center justify-center font-headline-lg-mobile text-headline-lg-mobile text-primary transition-all duration-300 relative"></div>
<div class="otp-slot w-10 h-14 border-b-2 border-border-subtle flex items-center justify-center font-headline-lg-mobile text-headline-lg-mobile text-primary transition-all duration-300 relative"></div>
</div>
<!-- Resend Timer -->
<div class="w-full text-center mt-stack-sm mb-stack-lg">
<button class="font-label-mono text-label-mono text-on-surface-variant hover:text-primary transition-colors">
                    Resend in <span class="text-accent-gold" id="timer">0:45</span>
</button>
</div>
<!-- Primary Action -->
<button class="w-full py-4 rounded-xl bg-glass-fill border border-border-subtle text-on-surface-variant font-label-mono text-label-mono tracking-widest uppercase transition-all duration-300 pointer-events-none opacity-50 flex justify-center items-center gap-2" id="verify-btn">
                Verify &amp; Complete Order
                <span class="material-symbols-outlined hidden" id="success-icon" style="font-size: 18px;">check_circle</span>
</button>
</div>
</main>
<!-- Implied Custom Numerical Keypad -->
<div class="w-full max-w-md px-margin-mobile pb-8 z-10">
<div class="grid grid-cols-3 gap-y-4 gap-x-4">
<!-- Row 1 -->
<button class="keypad-btn h-14 rounded-xl bg-glass-fill border border-border-subtle font-headline-lg-mobile text-headline-lg-mobile text-primary flex items-center justify-center active:scale-95 transition-transform" data-val="1">1</button>
<button class="keypad-btn h-14 rounded-xl bg-glass-fill border border-border-subtle font-headline-lg-mobile text-headline-lg-mobile text-primary flex items-center justify-center active:scale-95 transition-transform" data-val="2">2</button>
<button class="keypad-btn h-14 rounded-xl bg-glass-fill border border-border-subtle font-headline-lg-mobile text-headline-lg-mobile text-primary flex items-center justify-center active:scale-95 transition-transform" data-val="3">3</button>
<!-- Row 2 -->
<button class="keypad-btn h-14 rounded-xl bg-glass-fill border border-border-subtle font-headline-lg-mobile text-headline-lg-mobile text-primary flex items-center justify-center active:scale-95 transition-transform" data-val="4">4</button>
<button class="keypad-btn h-14 rounded-xl bg-glass-fill border border-border-subtle font-headline-lg-mobile text-headline-lg-mobile text-primary flex items-center justify-center active:scale-95 transition-transform" data-val="5">5</button>
<button class="keypad-btn h-14 rounded-xl bg-glass-fill border border-border-subtle font-headline-lg-mobile text-headline-lg-mobile text-primary flex items-center justify-center active:scale-95 transition-transform" data-val="6">6</button>
<!-- Row 3 -->
<button class="keypad-btn h-14 rounded-xl bg-glass-fill border border-border-subtle font-headline-lg-mobile text-headline-lg-mobile text-primary flex items-center justify-center active:scale-95 transition-transform" data-val="7">7</button>
<button class="keypad-btn h-14 rounded-xl bg-glass-fill border border-border-subtle font-headline-lg-mobile text-headline-lg-mobile text-primary flex items-center justify-center active:scale-95 transition-transform" data-val="8">8</button>
<button class="keypad-btn h-14 rounded-xl bg-glass-fill border border-border-subtle font-headline-lg-mobile text-headline-lg-mobile text-primary flex items-center justify-center active:scale-95 transition-transform" data-val="9">9</button>
<!-- Row 4 -->
<div></div> <!-- Empty slot -->
<button class="keypad-btn h-14 rounded-xl bg-glass-fill border border-border-subtle font-headline-lg-mobile text-headline-lg-mobile text-primary flex items-center justify-center active:scale-95 transition-transform" data-val="0">0</button>
<button class="keypad-btn h-14 rounded-xl bg-glass-fill border border-transparent text-on-surface-variant flex items-center justify-center active:scale-95 transition-transform hover:text-error" data-val="backspace">
<span class="material-symbols-outlined" style="font-size: 24px;">backspace</span>
</button>
</div>
</div>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const slots = document.querySelectorAll('.otp-slot');
            const keys = document.querySelectorAll('.keypad-btn');
            const verifyBtn = document.getElementById('verify-btn');
            const successIcon = document.getElementById('success-icon');
            
            let currentInput = "";
            const maxLength = 6;

            function updateUI() {
                // Update slots
                slots.forEach((slot, index) => {
                    slot.textContent = currentInput[index] || "";
                    
                    // Reset styling
                    slot.classList.remove('border-accent-gold', 'text-accent-gold', 'otp-success');
                    slot.classList.add('border-border-subtle', 'text-primary');
                    
                    // Active indicator
                    if (index === currentInput.length) {
                        slot.classList.remove('border-border-subtle');
                        slot.classList.add('border-accent-gold');
                        // Add an implied cursor using a pseudo-element dynamically via style if needed, but border color change is sufficient for minimalist look
                    }
                });

                // Check completion
                if (currentInput.length === maxLength) {
                    // Success state styling
                    slots.forEach(slot => {
                        slot.classList.add('otp-success');
                        slot.classList.remove('border-border-subtle');
                    });
                    
                    // Enable button
                    verifyBtn.classList.remove('bg-glass-fill', 'border-border-subtle', 'text-on-surface-variant', 'pointer-events-none', 'opacity-50');
                    verifyBtn.classList.add('bg-primary', 'text-on-primary', 'shadow-[0_0_20px_rgba(255,255,255,0.2)]', 'active:scale-95');
                    successIcon.classList.remove('hidden');
                } else {
                    // Disable button
                    verifyBtn.classList.add('bg-glass-fill', 'border-border-subtle', 'text-on-surface-variant', 'pointer-events-none', 'opacity-50');
                    verifyBtn.classList.remove('bg-primary', 'text-on-primary', 'shadow-[0_0_20px_rgba(255,255,255,0.2)]', 'active:scale-95');
                    successIcon.classList.add('hidden');
                }
            }

            // Handle Keypad Input
            keys.forEach(key => {
                key.addEventListener('click', () => {
                    const val = key.getAttribute('data-val');
                    
                    if (val === 'backspace') {
                        currentInput = currentInput.slice(0, -1);
                    } else if (currentInput.length < maxLength && val !== null) {
                        currentInput += val;
                    }
                    
                    updateUI();
                    
                    // Haptic feedback placeholder
                    if (navigator.vibrate) {
                        navigator.vibrate(10);
                    }
                });
            });

            // Initialize focus state on first slot
            updateUI();
        });
    </script>
</body></html>
