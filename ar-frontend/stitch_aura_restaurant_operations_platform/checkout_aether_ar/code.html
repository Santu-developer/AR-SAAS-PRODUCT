<style>
        body {

            color: theme('colors.on-surface');

            -moz-osx-font-smoothing: grayscale;

        /* Custom Scrollbar for sleekness */
        ::-webkit-scrollbar {
            width: 6px;
        }

            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Ambient Glow Effect */
        .ambient-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /* Subtle Inner Glow for Cards */

            box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.02);

        /* Smooth scale animation */

            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);

<style>
        @keyframes shimmer {
            100% { transform: translateX(100%); }

    </style>
<script>
        // Simple input focus glow effect
        const textarea = document.getElementById('instructions');
        textarea.addEventListener('focus', () => {
            textarea.parentElement.classList.add('shadow-[0_10px_30px_rgba(255,255,255,0.05)]');
        });
        textarea.addEventListener('blur', () => {
            textarea.parentElement.classList.remove('shadow-[0_10px_30px_rgba(255,255,255,0.05)]');
        });
    </script>
